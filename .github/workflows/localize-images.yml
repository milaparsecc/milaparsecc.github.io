name: Copy images from Framer into the repo

# Run manually (Actions → this workflow → Run workflow).
# Downloads every framerusercontent.com image/video into public/media
# and rewrites the JSON files to use the local copies.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/localize-images.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Copy images from Framer into the repo"
          git push
